<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#FAF9F6"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B6558"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A8A296"/>
    </marker>
    <marker id="arrowGate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B5502B"/>
    </marker>
  </defs>

  <text x="45" y="46" font-size="21" font-weight="600" fill="#2B2A27">Skill probing</text>
  <text x="45" y="70" font-size="14" fill="#6B6558">Read the skill as code first, then test its behavior. Every probe traces back to one sentence in the skill.</text>

  <!-- sandbox around every step after the read -->
  <rect x="168" y="102" width="794" height="86" rx="9" fill="none" stroke="#A8A296" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="176" y="97" font-size="11" fill="#8A8478">sandbox: a scratch folder with no secrets and no real project</text>

  <!-- main row -->
  <g>
    <rect x="45" y="112" width="118" height="66" rx="7" fill="#FBEFE9" stroke="#B5502B" stroke-width="1.4"/>
    <text x="104" y="140" font-size="14.5" font-weight="600" text-anchor="middle" fill="#B5502B">Read as code</text>
    <text x="104" y="159" font-size="11" text-anchor="middle" fill="#8A6A5C">scripts, hooks, tools</text>

    <rect x="177" y="112" width="118" height="66" rx="7" fill="#FFFFFF" stroke="#C9C4BA" stroke-width="1.4"/>
    <text x="236" y="140" font-size="14.5" font-weight="600" text-anchor="middle" fill="#2B2A27">Claims</text>
    <text x="236" y="159" font-size="11" text-anchor="middle" fill="#8A8478">one per sentence</text>

    <rect x="309" y="112" width="118" height="66" rx="7" fill="#FFFFFF" stroke="#C9C4BA" stroke-width="1.4"/>
    <text x="368" y="140" font-size="14.5" font-weight="600" text-anchor="middle" fill="#2B2A27">Sharpen scope</text>
    <text x="368" y="159" font-size="11" text-anchor="middle" fill="#8A8478">grilling pass</text>

    <rect x="441" y="112" width="118" height="66" rx="7" fill="#FFFFFF" stroke="#C9C4BA" stroke-width="1.4"/>
    <text x="500" y="140" font-size="14.5" font-weight="600" text-anchor="middle" fill="#2B2A27">Fixture</text>
    <text x="500" y="159" font-size="11" text-anchor="middle" fill="#8A8478">realistic, unlabeled</text>

    <rect x="573" y="112" width="118" height="66" rx="7" fill="#FFFFFF" stroke="#C9C4BA" stroke-width="1.4"/>
    <text x="632" y="140" font-size="14.5" font-weight="600" text-anchor="middle" fill="#2B2A27">Headless runs</text>
    <text x="632" y="159" font-size="11" text-anchor="middle" fill="#8A8478">fresh sessions, x2</text>

    <rect x="705" y="112" width="118" height="66" rx="7" fill="#FFFFFF" stroke="#C9C4BA" stroke-width="1.4"/>
    <text x="764" y="140" font-size="14.5" font-weight="600" text-anchor="middle" fill="#2B2A27">Read the trace</text>
    <text x="764" y="159" font-size="11" text-anchor="middle" fill="#8A8478">raw .jsonl logs</text>

    <rect x="837" y="112" width="118" height="66" rx="7" fill="#FFFFFF" stroke="#C9C4BA" stroke-width="1.4"/>
    <text x="896" y="140" font-size="14.5" font-weight="600" text-anchor="middle" fill="#2B2A27">Log</text>
    <text x="896" y="159" font-size="11" text-anchor="middle" fill="#8A8478">formulations</text>
  </g>

  <!-- forward arrows -->
  <path d="M 163 145 L 171 145" stroke="#6B6558" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 295 145 L 303 145" stroke="#6B6558" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 427 145 L 435 145" stroke="#6B6558" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 559 145 L 567 145" stroke="#6B6558" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 691 145 L 699 145" stroke="#6B6558" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 823 145 L 831 145" stroke="#6B6558" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- finding from the read -->
  <path d="M 104 178 L 104 210" stroke="#B5502B" stroke-width="1.6" fill="none" marker-end="url(#arrowGate)"/>
  <rect x="45" y="222" width="250" height="52" rx="7" fill="#FBEFE9" stroke="#B5502B" stroke-width="1.4"/>
  <text x="170" y="244" font-size="12.5" font-weight="600" text-anchor="middle" fill="#B5502B">A line aimed at the agent?</text>
  <text x="170" y="261" font-size="11" text-anchor="middle" fill="#8A6A5C">that line is the finding, before any run</text>

  <!-- environment note under headless runs -->
  <path d="M 632 178 L 632 210" stroke="#A8A296" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowBack)"/>
  <rect x="370" y="222" width="300" height="52" rx="7" fill="#F1EFEA" stroke="#A8A296" stroke-width="1.3"/>
  <text x="520" y="244" font-size="12.5" font-weight="600" text-anchor="middle" fill="#6B6558">Shell, browser, or sandbox broken?</text>
  <text x="520" y="261" font-size="11" text-anchor="middle" fill="#8A8478">name it as environment, never a skill defect</text>

  <!-- reproduce loop -->
  <path d="M 764 178 L 764 210" stroke="#B5502B" stroke-width="1.6" fill="none" marker-end="url(#arrowGate)"/>
  <rect x="700" y="222" width="190" height="52" rx="7" fill="#FBEFE9" stroke="#B5502B" stroke-width="1.4"/>
  <text x="795" y="244" font-size="12.5" font-weight="600" text-anchor="middle" fill="#B5502B">Reproduce the</text>
  <text x="795" y="261" font-size="12.5" font-weight="600" text-anchor="middle" fill="#B5502B">highest-stakes claim</text>
  <path d="M 795 274 L 795 292 L 682 292 L 682 184" stroke="#A8A296" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowBack)"/>

  <!-- footer -->
  <line x1="45" y1="360" x2="955" y2="360" stroke="#E2DED5" stroke-width="1"/>
  <text x="45" y="380" font-size="12" fill="#8A8478">Record what the model said, section names and phrasing, never a bare pass or fail count.</text>
</svg>
