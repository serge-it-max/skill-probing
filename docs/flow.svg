<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#FAF9F6"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B6558"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A8A296"/>
    </marker>
    <marker id="arrowGate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B5502B"/>
    </marker>
  </defs>

  <text x="45" y="46" font-size="21" font-weight="600" fill="#2B2A27">Skill probing</text>
  <text x="45" y="70" font-size="14" fill="#6B6558">Tests behavior, never just format. Every probe traces back to one sentence in the skill.</text>

  <!-- main row -->
  <g>
    <rect x="45" y="112" width="150" height="66" rx="7" fill="#FFFFFF" stroke="#C9C4BA" stroke-width="1.4"/>
    <text x="120" y="140" font-size="14.5" font-weight="600" text-anchor="middle" fill="#2B2A27">Claims</text>
    <text x="120" y="159" font-size="11" text-anchor="middle" fill="#8A8478">one sentence, one probe</text>

    <rect x="215" y="112" width="150" height="66" rx="7" fill="#FBEFE9" stroke="#B5502B" stroke-width="1.4"/>
    <text x="290" y="140" font-size="14.5" font-weight="600" text-anchor="middle" fill="#B5502B">Sharpen scope</text>
    <text x="290" y="159" font-size="11" text-anchor="middle" fill="#8A6A5C">grilling pass, first</text>

    <rect x="385" y="112" width="150" height="66" rx="7" fill="#FFFFFF" stroke="#C9C4BA" stroke-width="1.4"/>
    <text x="460" y="140" font-size="14.5" font-weight="600" text-anchor="middle" fill="#2B2A27">Fixture</text>
    <text x="460" y="159" font-size="11" text-anchor="middle" fill="#8A8478">real-looking, unlabeled</text>

    <rect x="555" y="112" width="150" height="66" rx="7" fill="#FFFFFF" stroke="#C9C4BA" stroke-width="1.4"/>
    <text x="630" y="140" font-size="14.5" font-weight="600" text-anchor="middle" fill="#2B2A27">Headless runs</text>
    <text x="630" y="159" font-size="11" text-anchor="middle" fill="#8A8478">plan + acceptEdits, x2</text>

    <rect x="725" y="112" width="150" height="66" rx="7" fill="#FFFFFF" stroke="#C9C4BA" stroke-width="1.4"/>
    <text x="800" y="140" font-size="14.5" font-weight="600" text-anchor="middle" fill="#2B2A27">Read the trace</text>
    <text x="800" y="159" font-size="11" text-anchor="middle" fill="#8A8478">raw .jsonl, beyond summary</text>

    <rect x="895" y="112" width="70" height="66" rx="7" fill="#FFFFFF" stroke="#C9C4BA" stroke-width="1.4"/>
    <text x="930" y="140" font-size="14.5" font-weight="600" text-anchor="middle" fill="#2B2A27">Log</text>
    <text x="930" y="159" font-size="11" text-anchor="middle" fill="#8A8478">formulations</text>
  </g>

  <!-- forward arrows -->
  <path d="M 195 145 L 209 145" stroke="#6B6558" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 365 145 L 379 145" stroke="#6B6558" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 535 145 L 549 145" stroke="#6B6558" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 705 145 L 719 145" stroke="#6B6558" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 875 145 L 889 145" stroke="#6B6558" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- environment note under headless runs -->
  <path d="M 630 178 L 630 210" stroke="#A8A296" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowBack)"/>
  <rect x="370" y="222" width="330" height="52" rx="7" fill="#F1EFEA" stroke="#A8A296" stroke-width="1.3"/>
  <text x="535" y="244" font-size="12.5" font-weight="600" text-anchor="middle" fill="#6B6558">Shell, browser, or sandbox broken?</text>
  <text x="535" y="261" font-size="11" text-anchor="middle" fill="#8A8478">name it as environment, never a skill defect</text>

  <!-- reproduce loop -->
  <path d="M 800 178 L 800 210" stroke="#B5502B" stroke-width="1.6" fill="none" marker-end="url(#arrowGate)"/>
  <rect x="730" y="222" width="190" height="52" rx="7" fill="#FBEFE9" stroke="#B5502B" stroke-width="1.4"/>
  <text x="825" y="244" font-size="12.5" font-weight="600" text-anchor="middle" fill="#B5502B">Reproduce the</text>
  <text x="825" y="261" font-size="12.5" font-weight="600" text-anchor="middle" fill="#B5502B">highest-stakes claim</text>
  <path d="M 825 274 L 825 292 L 630 292 L 630 184" stroke="#A8A296" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowBack)"/>

  <!-- footer -->
  <line x1="45" y1="360" x2="955" y2="360" stroke="#E2DED5" stroke-width="1"/>
  <text x="45" y="380" font-size="12" fill="#8A8478">Record what the model said, section names and phrasing, never a bare pass or fail count.</text>
</svg>
